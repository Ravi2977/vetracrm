<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Thanks for reaching out | Vetra CRM</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center}.thanks-page{width:min(560px,calc(100% - 40px));text-align:center;background:white;border:1px solid #e7ede9;padding:54px 32px;border-radius:10px;box-shadow:0 20px 60px #213e3010}.thanks-mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 24px;border-radius:50%;background:#e4f3e8;color:#438262;font-size:24px}.thanks-page .eyebrow{justify-content:center}.thanks-page h1{font-size:clamp(36px,8vw,52px);letter-spacing:-2px;line-height:1.1;margin:20px 0}.thanks-page h1 em{font:italic 400 1em Georgia,serif;color:#53856f}.thanks-page p{color:#77837d;font-size:14px;line-height:1.7;margin:0 auto 25px}</style></head><body><main class="thanks-page"><span class="thanks-mark">✓</span><div class="eyebrow"><span class="eyebrow-dot"></span> MESSAGE RECEIVED</div><h1>Thanks for starting<br><em>a conversation.</em></h1><p>Your enquiry is on its way to our team. We’ll be in touch soon.</p><a class="button button-primary" href="/">Back to Vetra CRM <span aria-hidden="true">↗</span></a></main></body></html>
